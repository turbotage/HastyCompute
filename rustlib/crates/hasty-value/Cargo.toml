[package]
name = "hasty-value"
description = "Value tree (tensors, lists, dicts, scalars) with a streaming, block-compressed wire / file format"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
num-complex.workspace = true
thiserror.workspace = true
lz4_flex = "0.14"
zstd = "0.14"
rayon = "1.12"
crc32fast = "1.5"
serde_json = "1"
blake3 = { version = "1.8.7", features = ["rayon"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[dev-dependencies]
rayon = "1.12"
