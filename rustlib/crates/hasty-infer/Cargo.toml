[package]
name = "hasty-infer"
description = "Model inference for volumes (segmentation): geometry, resampling, tiling recipes, pluggable backends (torch-free)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
serde_json = "1"
rayon = "1.12"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "cuda"], optional = true }

[features]
default = []
# ONNX Runtime backend; libonnxruntime is dlopen'ed at run time (ORT_DYLIB_PATH / HASTY_ORT), never linked
onnx = ["dep:ort"]
