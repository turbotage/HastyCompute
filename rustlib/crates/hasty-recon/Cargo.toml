[package]
name = "hasty-recon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reconstruction: multi-coil spiral 4D-flow encoding operators with physics (B0, concomitant, GNL), CG/P2nP solvers"

[dependencies]
hasty-site = { path = "../hasty-site" }
hasty-cuda = { path = "../hasty-cuda" }
hasty-nufft = { path = "../hasty-nufft" }
hasty-fft = { path = "../hasty-fft" }
hasty-toeplitz = { path = "../hasty-toeplitz" }
hasty-mrsim = { path = "../hasty-mrsim" }
hasty-seq = { path = "../hasty-seq" }
cudarc.workspace = true
num-complex.workspace = true
thiserror.workspace = true
nalgebra = "0.33"
serde_json = "1"
hasty-value = { path = "../hasty-value" }
ctrlc = { version = "3.5", features = ["termination"] }
libc = "0.2"
rayon = "1.12"
rustfft.workspace = true

[dev-dependencies]
hasty-testkit = { path = "../hasty-testkit" }
