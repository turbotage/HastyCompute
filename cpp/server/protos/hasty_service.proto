syntax = "proto3";

package hasty;

// 16-byte UUID
message Uuid { bytes value = 1; }

// Raw serialized GenericValue bytes
message DataChunk { bytes data = 1; }

// Fetch a GenericValue (or slice) from the bank
message FetchRequest {
    Uuid   id         = 1;
    string slice_info = 2; // empty = full value
}

// First message in a WriteValue stream carries the target ID and slice info,
// subsequent messages carry data chunks
message WriteHeader {
    Uuid   id         = 1;
    string slice_info = 2; // empty = full overwrite
}
message WriteMessage {
    oneof payload {
        WriteHeader header = 1;
        DataChunk   data   = 2;
    }
}
message WriteAck {
    bool   success   = 1;
    string error_msg = 2;
}

// Execute a function on values in the bank
message ExecuteCommand {
    int32           function_id = 1;
    string          options     = 2; // parsed later
    repeated Uuid   input_ids   = 3;
}
message ExecuteAck {
    bool           success     = 1;
    string         error_msg   = 2;
    repeated Uuid  output_ids  = 3;
}

service HastyService {
    // Upload a serialized GenericValue → assigned UUID
    rpc PushValue   (stream DataChunk)    returns (Uuid);

    // Download a GenericValue (or slice) by UUID
    rpc FetchValue  (FetchRequest)        returns (stream DataChunk);

    // Write to an existing GenericValue in the bank (or a slice of it)
    rpc WriteValue  (stream WriteMessage) returns (WriteAck);

    // Execute a function on bank values, results stored back in bank
    rpc Execute     (ExecuteCommand)      returns (ExecuteAck);

    // Remove a value from the bank, freeing its memory
    rpc DeleteValue (Uuid)               returns (WriteAck);
}
