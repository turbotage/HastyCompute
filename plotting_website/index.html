<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HastyEdit</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="shell">
        <header>
            <span class="title">HastyEdit</span>
        </header>
        <main>
            <nav class="tool-grid">
                <a class="tool-card" href="node_editor/">
                    <span class="tool-icon">⬡</span>
                    <span class="tool-name">Node Editor</span>
                    <span class="tool-desc">Compose processing graphs</span>
                </a>
                <a class="tool-card" href="orthoslicer/">
                    <span class="tool-icon">⊞</span>
                    <span class="tool-name">Ortho Slicer</span>
                    <span class="tool-desc">Multi-axis volume viewer</span>
                </a>
            </nav>
        </main>
    </div>
</body>
</html>
