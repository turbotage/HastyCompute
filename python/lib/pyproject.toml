[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hastycompute"
version = "0.1.0"
description = "Python side of the hasty Rust stack: HSTV value format (via hasty-value-capi), hasty.v2 gRPC client, GPU pacer"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.76.0",
    "numpy",
]

[project.optional-dependencies]
codegen = ["grpcio-tools>=1.76.0"]

[tool.setuptools.packages.find]
where = ["."]
